{% extends "base.html" %}
{% block nav_events %}nav-active{% endblock %}
{% block tab_events %}text-primary-500{% endblock %}
{% block mobile_title %}事件记录{% endblock %}

{% block content %}
<div x-data="eventsPage()" x-init="load()">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3 mb-4">
        <h1 class="text-lg font-bold">事件记录</h1>
        <button @click="openModal()" class="px-3 py-1.5 bg-primary-500 text-white text-sm rounded-lg hover:bg-primary-600">
            + 记录事件
        </button>
    </div>

    <!-- 筛选 -->
    <div class="flex flex-wrap gap-2 mb-4">
        <select x-model="filterType" @change="loadEvents()" class="border border-gray-200 px-3 py-1.5 text-sm focus:outline-none">
            <option value="">全部类型</option>
            <option value="违纪">违纪</option>
            <option value="表扬">表扬</option>
            <option value="处分">处分</option>
            <option value="谈话">谈话</option>
            <option value="家访">家访</option>
            <option value="其他">其他</option>
        </select>
        <input x-model="dateFrom" @change="loadEvents()" type="date" class="border border-gray-200 px-3 py-1.5 text-sm focus:outline-none">
        <span class="text-sm text-gray-400 self-center">至</span>
        <input x-model="dateTo" @change="loadEvents()" type="date" class="border border-gray-200 px-3 py-1.5 text-sm focus:outline-none">
    </div>

    <!-- 事件列表 -->
    <div class="space-y-2">
        <template x-for="ev in events" :key="ev.id">
            <div class="card p-4">
                <div class="flex items-start justify-between">
                    <div class="flex items-start gap-3">
                        <span class="inline-block px-2 py-0.5 rounded text-xs font-medium mt-0.5 shrink-0"
                              :class="{
                                  'bg-red-50 text-red-600': ev.event_type==='违纪'||ev.event_type==='处分',
                                  'bg-emerald-50 text-emerald-600': ev.event_type==='表扬',
                                  'bg-blue-50 text-blue-600': ev.event_type==='谈话'||ev.event_type==='家访',
                                  'bg-gray-100 text-gray-600': true
                              }" x-text="ev.event_type"></span>
                        <div>
                            <div class="text-sm">
                                <a :href="'/students/' + ev.student_id" class="text-primary-600 hover:underline font-medium" x-text="ev.student_name"></a>
                                <span class="mx-1 text-gray-300">·</span>
                                <span class="font-medium" x-text="ev.title"></span>
                            </div>
                            <div class="text-xs text-gray-500 mt-0.5" x-text="ev.description || ''"></div>
                            <div class="flex gap-3 mt-1.5 text-xs text-gray-400">
                                <span x-text="ev.event_date"></span>
                                <span x-show="ev.severity" x-text="ev.severity"></span>
                                <span x-show="ev.follow_up" x-text="'跟进: ' + ev.follow_up"></span>
                            </div>
                        </div>
                    </div>
                    <div class="flex gap-1 ml-2 shrink-0">
                        <button @click="editEvent(ev)" class="text-xs text-gray-400 hover:text-primary-500 px-1">编辑</button>
                        <button @click="deleteEvent(ev)" class="text-xs text-gray-400 hover:text-red-500 px-1">删除</button>
                    </div>
                </div>
            </div>
        </template>
        <div x-show="!events.length" class="text-center py-12 text-gray-400 text-sm">暂无事件记录</div>
    </div>

    <!-- 模态框 -->
    <div x-show="showModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center bg-black/40" @click.self="showModal = false">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md mx-4 p-5">
            <h3 class="text-base font-semibold mb-4" x-text="modal.id ? '编辑事件' : '记录事件'"></h3>
            <div class="space-y-3">
                <div>
                    <label class="text-xs text-gray-500">学生 *</label>
                    <select x-model="modal.student_id" class="w-full border border-gray-200 px-3 py-1.5 text-sm mt-0.5">
                        <option value="">选择学生</option>
                        <template x-for="s in allStudents" :key="s.id">
                            <option :value="s.id" x-text="s.name + ' (#' + s.student_no + ')'"></option>
                        </template>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs text-gray-500">事件类型 *</label>
                        <select x-model="modal.event_type" class="w-full border border-gray-200 px-3 py-1.5 text-sm mt-0.5">
                            <option>违纪</option><option>表扬</option><option>处分</option>
                            <option>谈话</option><option>家访</option><option>其他</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs text-gray-500">日期 *</label>
                        <input x-model="modal.event_date" type="date" class="w-full border border-gray-200 px-3 py-1.5 text-sm mt-0.5">
                    </div>
                </div>
                <div>
                    <label class="text-xs text-gray-500">标题 *</label>
                    <input x-model="modal.title" placeholder="简要描述" class="w-full border border-gray-200 px-3 py-1.5 text-sm mt-0.5">
                </div>
                <div>
                    <label class="text-xs text-gray-500">详细描述</label>
                    <textarea x-model="modal.description" rows="3" class="w-full border border-gray-200 px-3 py-1.5 text-sm mt-0.5"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs text-gray-500">严重程度</label>
                        <select x-model="modal.severity" class="w-full border border-gray-200 px-3 py-1.5 text-sm mt-0.5">
                            <option value="">-</option><option>轻微</option><option>一般</option><option>严重</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs text-gray-500">后续跟进</label>
                        <input x-model="modal.follow_up" class="w-full border border-gray-200 px-3 py-1.5 text-sm mt-0.5">
                    </div>
                </div>
            </div>
            <div class="flex justify-end gap-2 mt-4">
                <button @click="showModal = false" class="px-4 py-1.5 text-sm text-gray-500 hover:bg-gray-100 rounded-lg">取消</button>
                <button @click="saveEvent()" class="px-4 py-1.5 text-sm bg-primary-500 text-white rounded-lg hover:bg-primary-600">保存</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function eventsPage() {
    return {
        events: [], allStudents: [],
        filterType: '', dateFrom: '', dateTo: '',
        showModal: false, modal: {},
        async load() {
            this.allStudents = await api.get('/api/students');
            await this.loadEvents();
        },
        async loadEvents() {
            const p = new URLSearchParams();
            if (this.filterType) p.set('event_type', this.filterType);
            if (this.dateFrom) p.set('date_from', this.dateFrom);
            if (this.dateTo) p.set('date_to', this.dateTo);
            this.events = await api.get('/api/events?' + p);
        },
        openModal() {
            this.modal = {student_id: '', event_type: '违纪', event_date: new Date().toISOString().split('T')[0], title: '', description: '', severity: '', follow_up: ''};
            this.showModal = true;
        },
        editEvent(ev) {
            this.modal = {...ev};
            this.showModal = true;
        },
        async saveEvent() {
            if (!this.modal.student_id || !this.modal.title || !this.modal.event_date) { alert('学生、标题和日期必填'); return; }
            let res;
            if (this.modal.id) res = await api.put('/api/events/' + this.modal.id, this.modal);
            else res = await api.post('/api/events', this.modal);
            if (res.ok) { this.showModal = false; this.loadEvents(); }
        },
        async deleteEvent(ev) {
            if (!confirm('确定删除此事件？')) return;
            await api.del('/api/events/' + ev.id);
            this.loadEvents();
        }
    };
}
</script>
{% endblock %}
